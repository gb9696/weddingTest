<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3" />
  <meta name="format-detection" content="telephone=no" />
  <title>박근범 ♡ 이지현 결혼합니다</title>
  <meta name="description" content="청첩장 보러가기" />
  <!-- 카카오톡/문자 링크 미리보기 (주소를 본인 GitHub Pages 주소로 수정) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="박근범 ♡ 이지현 결혼합니다" />
  <meta property="og:description" content="2027년 2월 20일 토요일 오전 11시 10분" />
  <meta property="og:image" content="https://wedding-two-blue.vercel.app/images/main.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Yellowtail&family=Sacramento&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=202611181122" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="heart" viewBox="0 0 24 22"><path d="M12 21C9 18.6 1.2 13.7 1 7.4.9 3.6 3.6 1 6.8 1c2.3 0 3.9 1.3 5.2 3.2C13.3 2.3 14.9 1 17.2 1 20.4 1 23.1 3.6 23 7.4 22.8 13.7 15 18.6 12 21z"/></symbol>
    <symbol id="sparkle" viewBox="0 0 24 24"><path d="M12 1.5c.7 6.2 3.3 9.3 10.5 10.5-7.2 1.2-9.8 4.3-10.5 10.5-.7-6.2-3.3-9.3-10.5-10.5C8.7 10.8 11.3 7.7 12 1.5z" fill="none" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  </svg>
  <main class="wrap">

    <!-- 1. 메인 -->
    <section class="hero">
      <div class="hero-top">
        <span id="heroGroom"></span>
        <span class="hero-amp" aria-hidden="true">
          <svg viewBox="0 0 24 22"><path d="M12 21C9 18.6 1.2 13.7 1 7.4.9 3.6 3.6 1 6.8 1c2.3 0 3.9 1.3 5.2 3.2C13.3 2.3 14.9 1 17.2 1 20.4 1 23.1 3.6 23 7.4 22.8 13.7 15 18.6 12 21z"/></svg>
          <b>&amp;</b>
        </span>
        <span id="heroBride"></span>
      </div>
      <div class="hero-photo">
        <img id="mainPhoto" alt="메인 사진" />
        <div class="hero-deco" id="heroDeco" aria-hidden="true">
          <p class="hero-script">We're<br />getting<br />married</p>
          <svg class="deco h1" viewBox="0 0 24 22"><use href="#heart" /></svg>
          <svg class="deco h2" viewBox="0 0 24 22"><use href="#heart" /></svg>
          <svg class="deco h3" viewBox="0 0 24 22"><use href="#heart" /></svg>
          <svg class="deco h4" viewBox="0 0 24 22"><use href="#heart" /></svg>
          <svg class="deco s1" viewBox="0 0 24 24"><use href="#sparkle" /></svg>
          <svg class="deco s2" viewBox="0 0 24 24"><use href="#sparkle" /></svg>
          <svg class="deco s3" viewBox="0 0 24 24"><use href="#sparkle" /></svg>
          <svg class="deco s4" viewBox="0 0 24 24"><use href="#sparkle" /></svg>
          <svg class="deco s5" viewBox="0 0 24 24"><use href="#sparkle" /></svg>
          <svg class="deco s6" viewBox="0 0 24 24"><use href="#sparkle" /></svg>
          <svg class="deco wave" viewBox="0 0 60 14"><path d="M2 9c6-4 10 3 16 0M42 9c6-4 10 3 16 0" fill="none" stroke-width="1.6" stroke-linecap="round"/><path d="M30 12c-1.5-1.2-4-3-4-5 0-1.4 1-2.3 2.2-2.3.8 0 1.4.4 1.8 1 .4-.6 1-1 1.8-1C33 4.7 34 5.6 34 7c0 2-2.5 3.8-4 5z" fill="none" stroke-width="1.3"/></svg>
        </div>
      </div>
      <div class="hero-info">
        <p id="heroWhen"></p>
        <p id="heroWhere"></p>
      </div>
    </section>

    <!-- 2. 인사말 · 달력 · 혼주 -->
    <section class="sec invite fade">
      <p class="greeting" id="greeting"></p>
      <p class="script-title">Happily Ever After</p>
      <div class="mini-cal">
        <p class="mc-month" id="calMonth"></p>
        <table class="calendar" id="calendar"></table>
      </div>
      <div class="countdown" id="countdown"></div>
      <p class="dday" id="dday"></p>
      <div class="cal-add">
        <a href="wedding.ics" download="wedding.ics">📅 캘린더에 추가</a>
        <a id="calGoogle" target="_blank" rel="noopener">구글 캘린더에 추가</a>
      </div>
      <div class="parents" id="parents"></div>
      <button class="btn-outline" data-open="contactModal">연락하기</button>
    </section>

    <!-- 3. 갤러리 -->
    <section class="sec fade">
      <p class="eyebrow">GALLERY</p>
      <h2 class="title">사진첩</h2>
      <div class="gallery" id="gallery"></div>
      <div class="dots" id="dots"></div>
      <p class="hint">사진을 좌우로 밀어보세요.</p>
    </section>

    <!-- 5. 오시는 길 -->
    <section class="sec fade">
      <p class="eyebrow">LOCATION</p>
      <h2 class="title">오시는 길</h2>
      <p class="venue-name" id="venueName"></p>
      <p class="venue-addr" id="venueAddr"></p>
      <div class="map" id="mapBox"></div>
      <div class="map-btns">
        <a id="naverMap" target="_blank" rel="noopener">네이버지도</a>
        <a id="kakaoMap" target="_blank" rel="noopener">카카오맵</a>
        <a id="tmap" target="_blank" rel="noopener">티맵</a>
      </div>
      <div class="transport" id="transport"></div>
    </section>

    <!-- 6. 마음 전하실 곳 -->
    <section class="sec fade bg-soft">
      <p class="eyebrow">ACCOUNT</p>
      <h2 class="title">마음 전하실 곳</h2>
      <p class="desc">참석이 어려우신 분들을 위해<br />계좌번호를 기재하였습니다.<br />너그러운 마음으로 양해 부탁드립니다.</p>
      <div class="acc" id="accGroom"></div>
      <div class="acc" id="accBride"></div>
    </section>

    <!-- 7. 화환 -->
    <section class="sec fade" id="flowerSec">
      <p class="eyebrow">FLOWER</p>
      <h2 class="title">축하 화환 보내기</h2>
      <p class="desc">축하의 마음을 담아<br />화환을 보내실 수 있습니다.</p>
      <a class="btn-fill" id="flowerLink" target="_blank" rel="noopener">화환 주문하기</a>
    </section>

    <!-- 8. 공유 -->
    <section class="sec share fade">
      <button class="btn-kakao" id="kakaoShare">카카오톡으로 공유하기</button>
      <button class="btn-outline" id="copyLink">청첩장 링크 복사하기</button>
    </section>

    <footer class="footer">Thank you for celebrating with us</footer>
  </main>

  <!-- 연락처 모달 -->
  <div class="modal" id="contactModal">
    <div class="modal-box">
      <button class="modal-close" data-close>&times;</button>
      <h3>연락하기</h3>
      <div id="contactList"></div>
    </div>
  </div>

  <!-- 사진 크게 보기 -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" data-close>&times;</button>
    <button class="lb-nav lb-prev" id="lbPrev">&#8249;</button>
    <img id="lbImg" alt="" />
    <button class="lb-nav lb-next" id="lbNext">&#8250;</button>
    <p class="lb-count" id="lbCount"></p>
  </div>

  <button class="bgm-btn" id="bgmBtn" aria-label="배경음악">♪</button>
  <audio id="bgm" loop></audio>
  <div class="toast" id="toast"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
  <script src="config.js?v=202611181122"></script>
  <script src="script.js?v=202611181122"></script>
</body>
</html>
