<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>청첩장 QR 생성</title><style>body{font-family:system-ui,sans-serif;background:#f5f0e8;color:#25222a;max-width:550px;margin:70px auto;padding:20px}h1{font-size:28px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #aaa;background:#fff;border-radius:8px}button{padding:13px 22px;background:#1a1d28;color:#fff;border:0;border-radius:8px;margin:15px 5px 15px 0;cursor:pointer}#qr{background:#fff;padding:24px;display:inline-block;margin-top:20px}#qr canvas{display:block;max-width:100%}p{line-height:1.8;color:#6c625b}small{display:block;color:#8d6e5b}</style></head><body><h1>청첩장 QR코드 만들기</h1><p>GitHub Pages에 배포한 <b>최종 URL</b>을 입력하세요. 이 파일은 QR 제작용이며 청첩장에는 연결되지 않습니다.</p><input id="url" type="url" placeholder="https://USERNAME.github.io/cinematic-wedding/" aria-label="청첩장 URL"><button id="create">QR 생성</button><button id="save" disabled>PNG 저장</button><div id="qr"></div><p id="status" role="status"></p><small>QR 생성용 라이브러리를 CDN에서 불러옵니다. 최초 생성 시 인터넷 연결이 필요합니다.</small><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>const $=id=>document.getElementById(id);$('create').onclick=async()=>{try{const u=new URL($('url').value.trim());if(u.protocol!=='https:')throw Error('HTTPS 주소를 입력해 주세요.');if(!window.QRCode)throw Error('QR 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');$('qr').replaceChildren();const c=document.createElement('canvas');await QRCode.toCanvas(c,u.href,{width:720,margin:3,errorCorrectionLevel:'H',color:{dark:'#161b26',light:'#ffffff'}});$('qr').append(c);$('save').disabled=false;$('status').textContent='QR코드가 생성되었습니다. 휴대폰에서 스캔 테스트하세요.';}catch(e){$('status').textContent=e.message;$('save').disabled=true;}};$('save').onclick=()=>{const c=$('qr').querySelector('canvas');if(!c)return;const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='wedding-qr.png';a.click();};</script></body></html>
