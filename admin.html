<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>사진 관리</title>
  <style>
    :root { --ink: #3d3a36; --sub: #8c847a; --line: #e6ddd2; --point: #b28f6e; --yellow: #ffd21f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: #f6f3ee; color: var(--ink); font-size: 15px; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 80px; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .desc { color: var(--sub); font-size: 13px; margin-bottom: 22px; line-height: 1.6; }
    .card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    input[type=password] { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; }
    button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px; padding: 12px 16px; font-size: 15px; cursor: pointer; font-family: inherit; }
    .primary { background: var(--ink); color: #fff; width: 100%; margin-top: 10px; }
    .pick { background: var(--yellow); color: #3a3000; width: 100%; font-weight: 600; }
    .pick input { display: none; }
    .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
    .msg.err { color: #d14b4b; } .msg.ok { color: #2f8a4c; }
    .progress { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; margin-top: 12px; display: none; }
    .progress i { display: block; height: 100%; width: 0; background: var(--point); transition: width .2s; }
    .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .head h2 { font-size: 16px; }
    .head small { color: var(--sub); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .grid figure { position: relative; aspect-ratio: 1; background: #eee; border-radius: 6px; overflow: hidden; }
    .grid img { width: 100%; height: 100%; object-fit: cover; }
    .grid .no { position: absolute; left: 5px; top: 5px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; border-radius: 9px; padding: 1px 7px; }
    .grid .del { position: absolute; right: 5px; top: 5px; width: 26px; height: 26px; padding: 0; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 15px; }
    .empty { color: var(--sub); font-size: 13px; text-align: center; padding: 24px 0; }
    .tip { font-size: 12.5px; color: var(--sub); line-height: 1.7; }
    .hidden { display: none; }
    a { color: var(--point); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📷 사진첩 관리</h1>
    <p class="desc">여기서 올린 사진이 청첩장 사진첩에 표시돼요.<br />원본 사진을 그대로 골라도 자동으로 크기를 줄여서 올려요.</p>

    <!-- 로그인 -->
    <div class="card" id="loginCard">
      <input type="password" id="pw" placeholder="관리 비밀번호" autocomplete="current-password" />
      <button class="primary" id="loginBtn">들어가기</button>
      <p class="msg" id="loginMsg"></p>
    </div>

    <!-- 업로드 -->
    <div id="app" class="hidden">
      <div class="card">
        <label class="btn pick">＋ 사진 선택해서 올리기
          <input type="file" id="files" accept="image/*" multiple />
        </label>
        <div class="progress" id="prog"><i></i></div>
        <p class="msg" id="upMsg"></p>
        <p class="tip">· 여러 장을 한 번에 고를 수 있어요. 고른 순서(파일 이름 순)대로 사진첩 뒤에 붙어요.<br />
          · 올린 사진은 하객 화면에 <b>최대 5분 뒤</b> 반영돼요.</p>
      </div>

      <div class="card">
        <div class="head"><h2>사진첩</h2><small id="count"></small></div>
        <div class="grid" id="grid"></div>
        <p class="empty hidden" id="empty">아직 올린 사진이 없어요.<br />사진이 없으면 청첩장에는 기본 사진이 보여요.</p>
      </div>
      <p class="tip">청첩장 보기: <a href="/" target="_blank">/</a></p>
    </div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MAX_SIDE = 1600;      // 긴 쪽 최대 픽셀
  const QUALITY = 0.85;       // JPEG 화질
  let pw = "";
  try { pw = sessionStorage.getItem("wpw") || ""; } catch {}

  const api = async (path, opts = {}) => {
    const res = await fetch(path, { ...opts, headers: { "x-admin-password": pw, ...(opts.headers || {}) } });
    let data = {};
    try { data = await res.json(); } catch {}
    if (!res.ok) throw new Error(data.error || `오류가 났어요 (${res.status})`);
    return data;
  };

  /* 로그인 */
  const login = async () => {
    $("loginMsg").className = "msg"; $("loginMsg").textContent = "확인 중…";
    try {
      await api("/api/check");
      try { sessionStorage.setItem("wpw", pw); } catch {}
      $("loginCard").classList.add("hidden"); $("app").classList.remove("hidden");
      load();
    } catch (e) {
      $("loginMsg").className = "msg err"; $("loginMsg").textContent = e.message;
    }
  };
  $("loginBtn").onclick = () => { pw = $("pw").value.trim(); if (pw) login(); };
  $("pw").onkeydown = (e) => { if (e.key === "Enter") $("loginBtn").click(); };
  if (pw) login();

  /* 목록 */
  const load = async () => {
    const { photos } = await api("/api/photos?fresh=1");
    $("grid").innerHTML = "";
    $("count").textContent = `${photos.length}장`;
    $("empty").classList.toggle("hidden", photos.length > 0);
    photos.forEach((p, i) => {
      const f = document.createElement("figure");
      f.innerHTML = `<img src="${p.url}" loading="lazy" alt=""><span class="no">${i + 1}</span><button class="del" title="삭제">×</button>`;
      f.querySelector(".del").onclick = async () => {
        if (!confirm(`${i + 1}번 사진을 삭제할까요?`)) return;
        try { await api("/api/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: p.url }) }); load(); }
        catch (e) { alert(e.message); }
      };
      $("grid").appendChild(f);
    });
  };

  /* 사진 줄이기 (사진 방향 자동 보정) */
  const shrink = async (file) => {
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch {
      src = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => no(new Error("이 사진 형식은 열 수 없어요. (HEIC는 JPG로 바꿔서 올려주세요)")); im.src = URL.createObjectURL(file); });
    }
    const w = src.width, h = src.height, k = Math.min(1, MAX_SIDE / Math.max(w, h));
    const c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(src, 0, 0, c.width, c.height);
    return await new Promise((ok) => c.toBlob(ok, "image/jpeg", QUALITY));
  };

  /* 올리기 */
  $("files").onchange = async (e) => {
    const files = [...e.target.files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    e.target.value = "";
    if (!files.length) return;
    const prog = $("prog"), bar = prog.querySelector("i"), msg = $("upMsg");
    prog.style.display = "block"; msg.className = "msg";
    let done = 0, failed = [];
    for (const f of files) {
      msg.textContent = `올리는 중… ${done + 1} / ${files.length}`;
      try {
        const blob = await shrink(f);
        await api("/api/upload", { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: blob });
      } catch (err) { failed.push(`${f.name}: ${err.message}`); }
      done++; bar.style.width = `${(done / files.length) * 100}%`;
    }
    setTimeout(() => { prog.style.display = "none"; bar.style.width = "0"; }, 800);
    if (failed.length) { msg.className = "msg err"; msg.innerHTML = `${files.length - failed.length}장 완료, ${failed.length}장 실패<br>` + failed.join("<br>"); }
    else { msg.className = "msg ok"; msg.textContent = `${files.length}장을 올렸어요.`; }
    load();
  };
})();
</script>
</body>
</html>
